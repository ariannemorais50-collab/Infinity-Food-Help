<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="estilo.css">
    <title>Receita - Infinity Food Help</title>
</head>

<body>

<div class="receita-container">

    <button class="voltar" onclick="window.history.back()">
        ← Voltar
    </button>

    <div id="receita" class="receita-detalhes"></div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://psyqlxopvbzqurwecgxf.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UB8Lgo_gYB2JW0YkuHhW2Q_HD6WkR_b";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
function marcarReceitaConcluida() {

    let botao = document.querySelector(".botao-concluir");
    let mensagem = document.getElementById("mensagemConclusao");

    if (botao.dataset.concluida === "sim") {

        botao.dataset.concluida = "nao";
        botao.innerText = "Receita concluída! ✔️";
        mensagem.innerText = "";

        return;
    }

    let etapas = document.querySelectorAll(".checklist-card input[type='checkbox']");
    let todasConcluidas = true;

    etapas.forEach(function(etapa) {
        if (!etapa.checked) {
            todasConcluidas = false;
        }
    });

    if (!todasConcluidas) {
        mensagem.innerText =
            "Conclua todas as etapas antes de finalizar a receita.";
        return;
    }

    botao.dataset.concluida = "sim";
    botao.innerText = "Desmarcar conclusão";
    mensagem.innerText = "Receita concluída! ✔️";
}
function atualizarProgresso() {

    let etapas = document.querySelectorAll(".checklist-card input[type='checkbox']");
    let concluidas = 0;

    etapas.forEach(function(etapa) {
        if (etapa.checked) {
            concluidas++;
        }
    });

    document.getElementById("progresso").innerText =
        "Progresso: " + concluidas + " de " + etapas.length + " etapas concluídas";
}
        async function carregarReceita() {

            const parametros = new URLSearchParams(window.location.search);
            const id = parametros.get("id");

            let { data: receita, error } = await supabaseClient
                .from("receitas")
                .select("*")
                .eq("id", id)
                .single();

            if (error) {
                console.error("Erro ao carregar receita:", error);
                document.getElementById("receita").innerHTML =
                    "<p>Erro ao carregar a receita.</p>";
                return;
            }

            let ingredientes = "";

            receita.ingredientes.forEach(function(ingrediente) {
                ingredientes += "<li>" + ingrediente + "</li>";
            });

            let etapas = "";

            receita.etapas.forEach(function(etapa) {
                etapas += "<li>" + etapa + "</li>";
            });
let checklist = "";

receita.etapas.forEach(function(etapa, index) {
    checklist +=
        "<label>" +
       "<input type='checkbox' id='etapa" + index + "' onchange='atualizarProgresso()'>" +
        etapa +
        "</label>";
});
document.getElementById("receita").innerHTML =
    "<div class='receita-card'>" +

        "<div class='receita-imagem'>" +
            "🍰" +
        "</div>" +

        "<div class='receita-conteudo'>" +

            "<h1>" + receita.nome + "</h1>" +

            "<p class='descricao'>" +
                receita.descricao +
            "</p>" +

            "<div class='informacoes'>" +

                "<div>" +
                    "<strong>⏱️ Tempo</strong>" +
                    "<span>" + receita.tempo + "</span>" +
                "</div>" +

                "<div>" +
                    "<strong>🍰 Rendimento</strong>" +
                    "<span>" + receita.rendimento + "</span>" +
                "</div>" +

                "<div>" +
                    "<strong>📊 Dificuldade</strong>" +
                    "<span>" + receita.dificuldade + "</span>" +
                "</div>" +

            "</div>" +

            "<h2>Ingredientes</h2>" +
            "<ul>" + ingredientes + "</ul>" +

        "</div>" +

    "</div>" +

"<div class='preparo-card'>" +
    "<h2>Informações nutricionais</h2>" +
    "<p>" + (receita.informacoes_nutricionais || "Não informado.") + "</p>" +
"</div>" +

"<div class='checklist-card'>" +
    "<h2>✓ Checklist de preparo</h2>" +
    "<p>Marque cada etapa conforme for concluindo:</p>" +
    checklist +
"</div>" +

"<p id='progresso'>Progresso: 0 de " + receita.etapas.length + " etapas concluídas</p>" +

"<button class='botao-concluir' onclick='marcarReceitaConcluida()'>" +
    "Receita concluída! ✔️" +
"</button>" +

"<p id='mensagemConclusao'></p>";
        }

        carregarReceita();

    </script>

</body>

</html>
.receita-detalhes {
    background: white;
    max-width: 800px;
    margin: 30px auto;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(77, 0, 17, 0.12);
}
