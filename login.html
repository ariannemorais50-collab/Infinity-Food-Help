<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="estilo.css">
    <title>Login - Infinity Food Help</title>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Infinity Food Help</h1>

            <h2>Login do funcionário</h2>

            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <button onclick="fazerLogin()">
                Entrar
            </button>

            <button class="botao-cadastro" onclick="window.location.href='cadastro.html'">
                Criar uma conta
            </button>

            <button class="botao-cadastro" onclick="window.location.href='login-chef.html'">
                Login da Chef 👩‍🍳
            </button>

            <p id="mensagem"></p>

        </div>

    </div>

    <script>

        function fazerLogin() {

            let usuario = document.getElementById("usuario").value;
            let senha = document.getElementById("senha").value;

            let senhaSalva = localStorage.getItem("usuario_" + usuario);

            if (
                (usuario === "ana" && senha === "1234") ||
                (usuario === "marcos" && senha === "5678") ||
                (usuario === "maria" && senha === "9012") ||
                (senhaSalva !== null && senhaSalva === senha)
            ) {

                localStorage.setItem("usuarioLogado", usuario);

                window.location.href = "inicio.html";

            } else {

                document.getElementById("mensagem").innerText =
                    "Usuário ou senha incorretos.";

            }

        }

    </script>

</body>
</html>
