<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="estilo.css">
    <title>Cadastrar Receitas - Infinity Food Help</title>
</head>

<body>

    <div class="gerenciamento-container">

        <h1>Cadastrar receitas</h1>

        <button onclick="sairChef()">Sair</button>

        <p>Cadastre e organize as receitas do Infinity Food Help.</p>

        <div class="gerenciamento-card">

            <h2>Nova receita</h2>

            <label for="nomeReceita">Nome da receita</label>
            <input type="text" id="nomeReceita" placeholder="Ex: Bolo de Chocolate">

            <label for="descricaoReceita">Descrição</label>
            <input type="text" id="descricaoReceita" placeholder="Descrição da receita">

            <label for="nutricionalReceita">Informações nutricionais</label>
            <textarea id="nutricionalReceita"
                placeholder="Ex: Porção: 100g | Calorias: 250 kcal | Carboidratos: 30g | Proteínas: 5g | Gorduras: 10g"></textarea>

            <div class="campos-duplos">

                <div>
                    <label for="tempoReceita">Tempo</label>
                    <input type="text" id="tempoReceita" placeholder="Ex: 60 min">
                </div>

                <div>
                    <label for="rendimentoReceita">Rendimento</label>
                    <input type="text" id="rendimentoReceita" placeholder="Ex: 12 porções">
                </div>

            </div>

            <label for="dificuldadeReceita">Dificuldade</label>

            <select id="dificuldadeReceita">
                <option value="">Selecione</option>
                <option value="Fácil">Fácil</option>
                <option value="Médio">Médio</option>
                <option value="Difícil">Difícil</option>
            </select>

            <label for="categoriaReceita">Categoria</label>

            <select id="categoriaReceita">
                <option value="Bolos">🍰 Bolos</option>
                <option value="Brownies">🍫 Brownies</option>
                <option value="Brigadeiros">🍬 Brigadeiros</option>
            </select>

            <h3>Ingredientes</h3>

            <div id="ingredientes">
                <input type="text" class="ingrediente" placeholder="Ex: 250 g de farinha">
            </div>

            <button type="button" onclick="adicionarIngrediente()">
                + Adicionar ingrediente
            </button>

            <h3>Etapas do preparo</h3>

            <div id="etapas">
                <input type="text" class="etapa" placeholder="Ex: Misturar os ingredientes">
            </div>

            <button type="button" onclick="adicionarEtapa()">
                + Adicionar etapa
            </button>

            <button class="salvar-receita" type="button" onclick="salvarReceita()">
                SALVAR RECEITA
            </button>

            <p id="mensagem"></p>

            <h2>Receitas cadastradas</h2>

            <div id="listaReceitas"></div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://psyqlxopvbzqurwecgxf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_UB8Lgo_gYB2JW0YkuHhW2Q_HD6WkR_b";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // Verifica se a Chef está logada

        if (localStorage.getItem("chefLogada") !== "sim") {
            window.location.href = "login-chefe.html";
        }


        // Sair da conta da Chef

        function sairChef() {

            localStorage.removeItem("chefLogada");

            window.location.href = "login-chefe.html";
        }


        // Adicionar ingrediente

        function adicionarIngrediente() {

            let novoIngrediente = document.createElement("input");

            novoIngrediente.type = "text";
            novoIngrediente.className = "ingrediente";
            novoIngrediente.placeholder = "Digite um ingrediente";

            document.getElementById("ingredientes")
                .appendChild(novoIngrediente);
        }


        // Adicionar etapa

        function adicionarEtapa() {

            let novaEtapa = document.createElement("input");

            novaEtapa.type = "text";
            novaEtapa.className = "etapa";
            novaEtapa.placeholder = "Digite uma etapa";

            document.getElementById("etapas")
                .appendChild(novaEtapa);
        }


        // Salvar ou editar receita

        async function salvarReceita() {

            let nome =
                document.getElementById("nomeReceita").value;

            let descricao =
                document.getElementById("descricaoReceita").value;

            let tempo =
                document.getElementById("tempoReceita").value;

            let rendimento =
                document.getElementById("rendimentoReceita").value;

            let dificuldade =
                document.getElementById("dificuldadeReceita").value;

            let categoria =
                document.getElementById("categoriaReceita").value;

            let informacoesNutricionais =
                document.getElementById("nutricionalReceita").value;

            let receitaEditando =
                localStorage.getItem("receitaEditando");


            // Ingredientes

            let ingredientes = [];

            document.querySelectorAll(".ingrediente").forEach(function(input) {

                if (input.value.trim() !== "") {
                    ingredientes.push(input.value.trim());
                }

            });


            // Etapas

            let etapas = [];

            document.querySelectorAll(".etapa").forEach(function(input) {

                if (input.value.trim() !== "") {
                    etapas.push(input.value.trim());
                }

            });


            let data;
            let error;


            // EDITAR RECEITA

            if (receitaEditando) {

                ({ data, error } = await supabaseClient
                    .from("receitas")
                    .update({

                        nome: nome,
                        descricao: descricao,
                        tempo: tempo,
                        rendimento: rendimento,
                        dificuldade: dificuldade,
                        categoria: categoria,
                        informacoes_nutricionais: informacoesNutricionais,
                        ingredientes: ingredientes,
                        etapas: etapas

                    })
                    .eq("id", receitaEditando)
                    .select());

            }


            // NOVA RECEITA

            else {

                ({ data, error } = await supabaseClient
                    .from("receitas")
                    .insert([
                        {

                            nome: nome,
                            descricao: descricao,
                            tempo: tempo,
                            rendimento: rendimento,
                            dificuldade: dificuldade,
                            categoria: categoria,
                            informacoes_nutricionais: informacoesNutricionais,
                            ingredientes: ingredientes,
                            etapas: etapas

                        }
                    ])
                    .select());

            }


            // Erro

            if (error) {

                console.error(
                    "Erro ao salvar receita:",
                    error
                );

                document.getElementById("mensagem").innerText =
                    "Erro ao salvar a receita.";

                return;
            }


            // Sucesso

            console.log("Receita salva:", data);

            localStorage.removeItem("receitaEditando");

            document.getElementById("mensagem").innerText =
                "Receita salva com sucesso! ✔️";


            // Limpa formulário

            limparFormulario();

            mostrarReceitas();

        }


        // Limpar formulário

        function limparFormulario() {

            document.getElementById("nomeReceita").value = "";
            document.getElementById("descricaoReceita").value = "";
            document.getElementById("tempoReceita").value = "";
            document.getElementById("rendimentoReceita").value = "";
            document.getElementById("dificuldadeReceita").value = "";
            document.getElementById("categoriaReceita").value = "Bolos";
            document.getElementById("nutricionalReceita").value = "";


            document.getElementById("ingredientes").innerHTML =
                '<input type="text" class="ingrediente" placeholder="Ex: 250 g de farinha">';


            document.getElementById("etapas").innerHTML =
                '<input type="text" class="etapa" placeholder="Ex: Misturar os ingredientes">';
        }


        // Mostrar receitas cadastradas

        async function mostrarReceitas() {

            console.log("mostrarReceitas foi executada");

            let lista =
                document.getElementById("listaReceitas");

            lista.innerHTML =
                "Carregando receitas...";


            let { data, error } =
                await supabaseClient
                    .from("receitas")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


            if (error) {

                console.error(
                    "Erro ao carregar receitas:",
                    error
                );

                lista.innerHTML =
                    "Erro ao carregar as receitas.";

                return;
            }


            lista.innerHTML = "";


            data.forEach(function(receita) {

                let div =
                    document.createElement("div");


                div.innerHTML =

                    "<h3>" +
                    receita.nome +
                    "</h3>" +

                    "<p>" +
                    receita.descricao +
                    "</p>" +

                    "<p>📂 " +
                    (receita.categoria || "Sem categoria") +
                    "</p>" +

                    "<p>⏱️ " +
                    receita.tempo +
                    " | 🍰 " +
                    receita.rendimento +
                    "</p>" +

                    "<button onclick=\"editarReceita('" +
                    receita.id +
                    "')\">" +
                    "✏️ Editar" +
                    "</button>" +

                    "<button onclick=\"excluirReceita('" +
                    receita.id +
                    "')\">" +
                    "🗑️ Excluir" +
                    "</button>";


                lista.appendChild(div);

            });

        }


        // Editar receita

        async function editarReceita(id) {

            let {
                data: receita,
                error
            } = await supabaseClient

                .from("receitas")

                .select("*")

                .eq("id", id)

                .single();


            if (error) {

                console.error(
                    "Erro ao carregar receita:",
                    error
                );

                return;
            }


            document.getElementById("nomeReceita").value =
                receita.nome || "";

            document.getElementById("descricaoReceita").value =
                receita.descricao || "";

            document.getElementById("tempoReceita").value =
                receita.tempo || "";

            document.getElementById("rendimentoReceita").value =
                receita.rendimento || "";

            document.getElementById("dificuldadeReceita").value =
                receita.dificuldade || "";

            document.getElementById("categoriaReceita").value =
                receita.categoria || "Bolos";

            document.getElementById("nutricionalReceita").value =
                receita.informacoes_nutricionais || "";


            // Ingredientes da receita

            let ingredientesDiv =
                document.getElementById("ingredientes");

            ingredientesDiv.innerHTML = "";


            if (receita.ingredientes &&
                receita.ingredientes.length > 0) {

                receita.ingredientes.forEach(function(ingrediente) {

                    let input =
                        document.createElement("input");

                    input.type = "text";
                    input.className = "ingrediente";
                    input.value = ingrediente;

                    ingredientesDiv.appendChild(input);

                });

            }


            // Etapas da receita

            let etapasDiv =
                document.getElementById("etapas");

            etapasDiv.innerHTML = "";


            if (receita.etapas &&
                receita.etapas.length > 0) {

                receita.etapas.forEach(function(etapa) {

                    let input =
                        document.createElement("input");

                    input.type = "text";
                    input.className = "etapa";
                    input.value = etapa;

                    etapasDiv.appendChild(input);

                });

            }


            localStorage.setItem(
                "receitaEditando",
                receita.id
            );


            document.getElementById("mensagem").innerText =
                "Receita carregada para edição. ✏️";

        }


        // Excluir receita

        async function excluirReceita(id) {

            let confirmar =
                confirm(
                    "Tem certeza que deseja excluir esta receita?"
                );


            if (!confirmar) {
                return;
            }


            let { error } =
                await supabaseClient

                    .from("receitas")

                    .delete()

                    .eq("id", id);


            if (error) {

                console.error(
                    "Erro ao excluir receita:",
                    error
                );

                document.getElementById("mensagem").innerText =
                    "Erro ao excluir a receita.";

                return;
            }


            document.getElementById("mensagem").innerText =
                "Receita excluída com sucesso! 🗑️";


            mostrarReceitas();

        }


        // Carrega as receitas ao abrir a página

        mostrarReceitas();

    </script>

</body>

</html>
