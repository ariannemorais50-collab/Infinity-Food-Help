<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="estilo.css">
    <title>Cadastrar Receitas - Infinity Food Help</title>
</head>

<body>

    <div class="gerenciamento-container">

        <h1>Gerenciamento das receitas</h1>
<button onclick="sairChef()">Sair</button>
        <p>Cadastre e organize as receitas do Infinity Food Help.</p>

        <div class="gerenciamento-card">

            <h2>Nova receita</h2>

            <label for="nomeReceita">Nome da receita</label>
            <input type="text" id="nomeReceita" placeholder="Ex: Bolo de Chocolate">

            <label for="descricaoReceita">Descrição</label>
            <input type="text" id="descricaoReceita" placeholder="Descrição da receita">

            <div class="campos-duplos">

                <div>
                    <label for="tempoReceita">Tempo</label>
                    <input type="text" id="tempoReceita" placeholder="Ex: 60 min">
                </div>

                <div>
                    <label for="rendimentoReceita">Rendimento</label>
                    <input type="text" id="rendimentoReceita" placeholder="Ex: 12 porções">
                </div>

            </div>

            <label for="dificuldadeReceita">Dificuldade</label>

            <select id="dificuldadeReceita">
                <option value="">Selecione</option>
                <option value="Fácil">Fácil</option>
                <option value="Médio">Médio</option>
                <option value="Difícil">Difícil</option>
            </select>

            <h3>Ingredientes</h3>

            <div id="ingredientes">
                <input type="text" class="ingrediente" placeholder="Ex: 250 g de farinha">
            </div>

            <button type="button" onclick="adicionarIngrediente()">
                + Adicionar ingrediente
            </button>

            <h3>Etapas do preparo</h3>

            <div id="etapas">
                <input type="text" class="etapa" placeholder="Ex: Misturar os ingredientes">
            </div>

            <button type="button" onclick="adicionarEtapa()">
                + Adicionar etapa
            </button>

            <button class="salvar-receita" type="button" onclick="salvarReceita()">
                SALVAR RECEITA
            </button>

            <p id="mensagem"></p>
<h2>Receitas cadastradas</h2>

<div id="listaReceitas"></div>
        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL = "https://psyqlxopvbzqurwecgxf.supabase.co";
const SUPABASE_KEY = "sb_publishable_UB8Lgo_gYB2JW0YkuHhW2Q_HD6WkR_b";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
supabaseClient
    .from("receitas")
    .select("*")
    .then(function(resultado) {
        console.log("Teste da tabela receitas:", resultado);
    });
</script>
console.log("Conexão com Supabase criada:", supabaseClient);
    <script>
        console.log("Supabase carregado:", supabase);
if (localStorage.getItem("chefLogada") !== "sim") {
    window.location.href = "login-chef.html";
}
        function adicionarIngrediente() {

            let novoIngrediente = document.createElement("input");

            novoIngrediente.type = "text";
            novoIngrediente.className = "ingrediente";
            novoIngrediente.placeholder = "Digite um ingrediente";

            document.getElementById("ingredientes").appendChild(novoIngrediente);
        }

        function adicionarEtapa() {

            let novaEtapa = document.createElement("input");

            novaEtapa.type = "text";
            novaEtapa.className = "etapa";
            novaEtapa.placeholder = "Digite uma etapa";

            document.getElementById("etapas").appendChild(novaEtapa);
        }

async function salvarReceita() {

    let nome = document.getElementById("nomeReceita").value;
    let descricao = document.getElementById("descricaoReceita").value;
    let tempo = document.getElementById("tempoReceita").value;
    let rendimento = document.getElementById("rendimentoReceita").value;
    let dificuldade = document.getElementById("dificuldadeReceita").value;

    let ingredientes = [];

    document.querySelectorAll(".ingrediente").forEach(function(input) {
        if (input.value !== "") {
            ingredientes.push(input.value);
        }
    });

    let etapas = [];

    document.querySelectorAll(".etapa").forEach(function(input) {
        if (input.value !== "") {
            etapas.push(input.value);
        }
    });

    let { data, error } = await supabaseClient
        .from("receitas")
        .insert([
            {
                nome: nome,
                descricao: descricao,
                tempo: tempo,
                rendimento: rendimento,
                dificuldade: dificuldade,
                ingredientes: ingredientes,
                etapas: etapas
            }
        ])
        .select();

    if (error) {

        console.error("Erro ao salvar receita:", error);

        document.getElementById("mensagem").innerText =
            "Erro ao salvar a receita.";

        return;
    }

    console.log("Receita salva:", data);

    document.getElementById("mensagem").innerText =
        "Receita salva com sucesso! ✔️";

    mostrarReceitas();
}

async function mostrarReceitas() {

    let lista = document.getElementById("listaReceitas");

    lista.innerHTML = "Carregando receitas...";

    let { data, error } = await supabaseClient
        .from("receitas")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {

        console.error("Erro ao carregar receitas:", error);

        lista.innerHTML = "Erro ao carregar as receitas.";

        return;
    }

    lista.innerHTML = "";

    data.forEach(function(receita) {

        let div = document.createElement("div");

        div.innerHTML =
            "<h3>" + receita.nome + "</h3>" +
            "<p>" + receita.descricao + "</p>" +
            "<p>⏱️ " + receita.tempo +
            " | 🍰 " + receita.rendimento + "</p>" +
            "<button onclick=\"editarReceita('" + receita.id + "')\">✏️ Editar</button>" +
            "<button onclick=\"excluirReceita('" + receita.id + "')\">🗑️ Excluir</button>";

        lista.appendChild(div);

    });
}

    </script>

</body>

</html>
