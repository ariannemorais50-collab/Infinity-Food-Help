<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="estilo.css">
    <title>Brigadeiros - Infinity Food Help</title>
</head>

<body>

    <div class="receita-container">

        <button class="voltar" onclick="window.location.href='inicio.html'">
            ← Voltar
        </button>

        <h1 style="text-align: center;">
            🍬 Brigadeiros
        </h1>

        <div
            class="lista-receitas"
            id="listaReceitas">

            <p>Carregando receitas...</p>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://psyqlxopvbzqurwecgxf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_UB8Lgo_gYB2JW0YkuHhW2Q_HD6WkR_b";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function carregarBrigadeiros() {

            const lista =
                document.getElementById(
                    "listaReceitas"
                );


            const {
                data,
                error
            } = await supabaseClient

                .from("receitas")

                .select("*")

                .eq(
                    "categoria",
                    "Brigadeiros"
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Erro ao carregar brigadeiros:",
                    error
                );

                lista.innerHTML =
                    "<p>Erro ao carregar as receitas.</p>";

                return;
            }


            lista.innerHTML = "";


            if (!data || data.length === 0) {

                lista.innerHTML =
                    "<p>Nenhuma receita de brigadeiro cadastrada ainda.</p>";

                return;
            }


            data.forEach(
                function(receita) {

                    lista.innerHTML +=

                        "<div class='receita-card'>" +

                            "<div class='receita-imagem'>" +

                                "🍬" +

                            "</div>" +

                            "<div class='receita-conteudo'>" +

                                "<h2>" +
                                    receita.nome +
                                "</h2>" +

                                "<p class='descricao'>" +
                                    receita.descricao +
                                "</p>" +

                                "<button class='botao-receita' " +

                                "onclick=\"window.location.href='receita-online.html?id=" +
                                    receita.id +
                                "'\">" +

                                    "Ver receita" +

                                "</button>" +

                            "</div>" +

                        "</div>";

                }
            );

        }


        carregarBrigadeiros();

    </script>

</body>

</html>
